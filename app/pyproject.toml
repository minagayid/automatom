[project]
name = "automatom-briefrunner"
version = "0.1.0"
description = "An approval-gated background briefing agent powered by Gemini on Vertex AI."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "aiosqlite>=0.20,<1.0",
    "google-genai>=1.0,<2.0",
    "google-auth>=2.35,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = [".", ".."]

[tool.ruff]
line-length = 100
